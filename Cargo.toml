[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Workspace crates: every package is `vl-<name>` and declares its layer in
# `[package.metadata.vl] layer`; `cargo xtask ci` checks the layer rules (docs/architecture.md).
[workspace.dependencies]
vl-core = { path = "crates/vl-core" }
vl-meta = { path = "crates/vl-meta" }
vl-mods = { path = "crates/vl-mods" }
vl-resources = { path = "crates/vl-resources" }
vl-crash = { path = "crates/vl-crash" }
vl-bisect = { path = "crates/vl-bisect" }
vl-store = { path = "crates/vl-store" }
vl-net = { path = "crates/vl-net" }
vl-tasks = { path = "crates/vl-tasks" }
vl-settings = { path = "crates/vl-settings" }
vl-auth = { path = "crates/vl-auth" }
vl-java = { path = "crates/vl-java" }
vl-instance = { path = "crates/vl-instance" }
vl-launch = { path = "crates/vl-launch" }
vl-loaders = { path = "crates/vl-loaders" }
vl-modrinth = { path = "crates/vl-modrinth" }
vl-curseforge = { path = "crates/vl-curseforge" }
vl-platforms = { path = "crates/vl-platforms" }
vl-install = { path = "crates/vl-install" }
vl-backend = { path = "crates/vl-backend" }
vl-mock = { path = "crates/vl-mock" }
vl-ui-egui = { path = "crates/vl-ui-egui" }
vl-update = { path = "crates/vl-update" }
vl-updater = { path = "crates/vl-updater" }

# Third-party crates.
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
getrandom = "0.3.4"
ctrlc = "3.5.2"
rpassword = "7.5.4"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
keyring-core = "1.0.1"
minisign-verify = "0.3.0"
# Signs release manifests: tests with throwaway keys made inside them, and `cargo xtask release sign`.
minisign = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tar = { version = "0.4.45", default-features = false }
toml = "1.1.8"
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "socks-proxy"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
eframe = "0.37.0"
fluent-bundle = "0.16.0"
intl-memoizer = "0.5.3"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
# Windows only: the icon and version resource of the executables (build scripts), the
# AppUserModelID, the tray's message loop and the working set trim of the desktop app.
winresource = { version = "0.1.34", default-features = false }
winsafe = { version = "0.0.29", features = ["shell", "gui", "psapi"] }
# The tray icon of the desktop app while it watches a running game. On Linux and the BSDs it is
# a D-Bus StatusNotifierItem (ksni), without GTK.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# macOS only: the desktop app's AppKit event pump and Dock presence while it watches a game (the
# safe Objective-C bindings `tray-icon` uses as well).
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSString"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
