[package]
name = "vl-app"
description = "VibeLauncher desktop app: an eframe window around the shared egui interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.vl]
layer = "app"

[[bin]]
name = "vibelauncher"
path = "src/main.rs"

[dependencies]
vl-core.workspace = true
vl-backend.workspace = true
vl-mock.workspace = true
vl-ui-egui.workspace = true
eframe.workspace = true
sys-locale.workspace = true

[features]
# `VL_DEV_GAME` replaces the game with a test program: the watcher budget measurement
# (`tests/watcher_budget.rs`). Never in a release.
dev-game = ["vl-backend/dev-game"]

[dev-dependencies]
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
winsafe.workspace = true

[target.'cfg(any(windows, target_os = "macos", target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
